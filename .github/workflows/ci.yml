name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck-lint-test:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    # These tests exercise real Supabase data (inquiries, submissions, an
    # admin login) — they need SUPABASE_URL/ANON_KEY and an admin account
    # for whatever project these secrets point at. Skips cleanly on forks/
    # PRs that don't have repo secrets, rather than failing CI for
    # contributors who can't have them. Ideally these point at a dedicated
    # test Supabase project, not the same one used for local dev — see the
    # production-readiness plan's Phase 7 (environment separation).
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run e2e tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Supabase secrets not configured for this run — skipping e2e."
            exit 0
          fi
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
